[project]
name = "voice-sim2real"
version = "0.1.0"
description = "Do synthetic callers change which model wins? Measuring the acoustic sim-to-real gap in voice-agent evaluation."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Amir Kellou-Sidhoum" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.1.0",
    "en-core-web-sm",
    "huggingface-hub>=2.2.0",
    "jiwer>=4.0.0",
    "kokoro>=0.9.4",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "misaki[en]>=0.9.4",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "parakeet-mlx>=0.5.3",
    "piper-tts>=1.8.0",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "transformers>=5.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sim2real"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[project.urls]
Repository = "https://github.com/AmirK-S/voice-sim2real"
